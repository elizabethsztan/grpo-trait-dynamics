GRPOConfig: {steps: 20, batch_size: 32, G: 8, lr: 1.0e-4, kl_coef: 0.02, clip: null, lora_rank: 16, lora_layers: ">L", checkpoint_every: 1, num_runs: 1, seed: 240113}
