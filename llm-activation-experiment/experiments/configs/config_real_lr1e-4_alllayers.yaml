# All-layers variant of the headline run (config_real_lr1e-4.yaml). Identical in
# every respect EXCEPT GRPOConfig.lora_layers: "all" -- LoRA now trains every
# decoder layer including <= L, so the layer-12 trait is NO LONGER frozen
# (Delta s != 0). This is the transmission-term test: does the extra Price term
# E[omega*Delta s], which is zero for frozen-activation traits, materially change
# ΔT? Run Phase 3 with --transmission to log the decomposition
# ΔT ~= cov (selection) + transmission.
#
# Features are REUSED from pilot_lr1e-4 (feature discovery runs on the BASE model +
# frozen SAE, independent of which layers LoRA later trains), so features.json is
# copied into results/real_lr1e-4_alllayers/ before launch and Phase 0/1 are skipped.
# The Phase-2 frozen-trait assertion is auto-skipped for lora_layers="all".
ModelConfig:
  backbone: Qwen/Qwen3.5-2B-Base
  sae_repo: Qwen/SAE-Res-Qwen3.5-2B-Base-W32K-L0_100
  layer_L: 12
  seed: 290402
DataConfig: {dataset: gsm8k, n_train: 2000, n_feat: 300, n_eval: 500}
GenConfig: {temperature: 1.0, top_p: 1.0, top_k: 0, max_new_tokens: 256, prompt_style: few_shot, n_shots: 4}
CapabilityConfig: {n_prompts: 100, temperature: 1.0, target_success_band: [0.2, 0.7]}
FeatureDiscoveryConfig: {K: 8, candidate_layers: [12], min_activity: 0.1, top_k_each_sign: 5, val_frac: 0.5, n_controls: 5}
GRPOConfig: {steps: 20, batch_size: 32, G: 8, lr: 1.0e-4, kl_coef: 0.02, clip: null, lora_rank: 16, lora_layers: "all", checkpoint_every: 1, num_runs: 1, seed: 290402}
PriceEvalConfig: {price_samples: [512], direct_samples: 512, eval_prompts: 500, batch_size: 8}
OutputConfig: {results_dir: results, name: real_lr1e-4_alllayers}
