# Seed replicate #3 of config_real_lr1e-4_alllayers.yaml (all-layers LoRA, transmission-term
# test). IDENTICAL to that run except GRPOConfig.seed and OutputConfig.name. GRPOConfig.seed
# matches config_real_lr1e-4_s3.yaml so each all-layers seed pairs with a frozen-layer seed.
# ModelConfig.seed held at 290402 so only the GRPO trajectory varies. features.json copied from
# results/real_lr1e-4_alllayers/ before launch (Phase 0/1 skipped). Phase 3 must be run with
# --transmission --step-stride 3, as for the original all-layers run.
ModelConfig:
  backbone: Qwen/Qwen3.5-2B-Base
  sae_repo: Qwen/SAE-Res-Qwen3.5-2B-Base-W32K-L0_100
  layer_L: 12
  seed: 290402
DataConfig: {dataset: gsm8k, n_train: 2000, n_feat: 300, n_eval: 500}
GenConfig: {temperature: 1.0, top_p: 1.0, top_k: 0, max_new_tokens: 256, prompt_style: few_shot, n_shots: 4}
CapabilityConfig: {n_prompts: 100, temperature: 1.0, target_success_band: [0.2, 0.7]}
FeatureDiscoveryConfig: {K: 8, candidate_layers: [12], min_activity: 0.1, top_k_each_sign: 5, val_frac: 0.5, n_controls: 5}
GRPOConfig: {steps: 20, batch_size: 32, G: 8, lr: 1.0e-4, kl_coef: 0.02, clip: null, lora_rank: 16, lora_layers: "all", checkpoint_every: 1, num_runs: 1, seed: 240113}
PriceEvalConfig: {price_samples: [512], direct_samples: 512, eval_prompts: 500, batch_size: 8}
OutputConfig: {results_dir: results, name: real_lr1e-4_alllayers_s3}
