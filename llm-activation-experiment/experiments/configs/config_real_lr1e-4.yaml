# Real run at lr=1e-4 (the pilot's sweet spot). Trains 20 GRPO steps and banks a
# checkpoint per step (~30 MB LoRA each) as the frozen policy trajectory. Phase 3
# (Price eval) is run SEPARATELY on these checkpoints so its N budgets can be
# toggled without retraining -- see slurm/real_train.sh (Phase 2 only) and
# slurm/lr_pilot_price.sh (Phase 3 only, re-runnable).
#
# Features are REUSED from pilot_lr1e-4 (same base model + feat split -> identical
# SAE features); features.json is copied into results/real_lr1e-4/ before launch,
# so Phase 0/1 are skipped entirely.
ModelConfig:
  backbone: Qwen/Qwen3.5-2B-Base
  sae_repo: Qwen/SAE-Res-Qwen3.5-2B-Base-W32K-L0_100
  layer_L: 12
  seed: 290402
DataConfig: {dataset: gsm8k, n_train: 2000, n_feat: 300, n_eval: 500}
GenConfig: {temperature: 1.0, top_p: 1.0, top_k: 0, max_new_tokens: 256, prompt_style: few_shot, n_shots: 4}
CapabilityConfig: {n_prompts: 100, temperature: 1.0, target_success_band: [0.2, 0.7]}
FeatureDiscoveryConfig: {K: 8, candidate_layers: [12], min_activity: 0.1, top_k_each_sign: 5, val_frac: 0.5, n_controls: 5}
GRPOConfig: {steps: 20, batch_size: 32, G: 8, lr: 1.0e-4, kl_coef: 0.02, clip: null, lora_rank: 16, lora_layers: ">L", checkpoint_every: 1, num_runs: 1, seed: 290402}
# Phase-3 budget: price=direct=512 -> 512 + 2*512 = 1536 gen-units/transition
# -> ~9.5h over 20 transitions (under the ampere 12h cap). Noise floor ~0.018 <<
# lr=1e-4 signal 0.059 -> expected slope ~0.92. Big-N is reserved for the separate
# single-transition convergence diagnostic (--max-transitions 1). Via slurm/real_price.sh.
PriceEvalConfig: {price_samples: [512], direct_samples: 512, eval_prompts: 500, batch_size: 8}
OutputConfig: {results_dir: results, name: real_lr1e-4}
