# Seed replicate #2 of config_real_lr1e-4.yaml, for a 3-seed CI on the Price-test
# slope/corr. IDENTICAL to the headline run except GRPOConfig.seed (new training
# trajectory) and OutputConfig.name. ModelConfig.seed is held at 290402 on purpose, so
# the data splits, tracked features, eval distribution and controls are all identical --
# only the GRPO trajectory varies. features.json is copied from results/real_lr1e-4/ into
# results/real_lr1e-4_s2/ before launch (Phase 0/1 skipped; same frozen directions).
ModelConfig:
  backbone: Qwen/Qwen3.5-2B-Base
  sae_repo: Qwen/SAE-Res-Qwen3.5-2B-Base-W32K-L0_100
  layer_L: 12
  seed: 290402
DataConfig: {dataset: gsm8k, n_train: 2000, n_feat: 300, n_eval: 500}
GenConfig: {temperature: 1.0, top_p: 1.0, top_k: 0, max_new_tokens: 256, prompt_style: few_shot, n_shots: 4}
CapabilityConfig: {n_prompts: 100, temperature: 1.0, target_success_band: [0.2, 0.7]}
FeatureDiscoveryConfig: {K: 8, candidate_layers: [12], min_activity: 0.1, top_k_each_sign: 5, val_frac: 0.5, n_controls: 5}
GRPOConfig: {steps: 20, batch_size: 32, G: 8, lr: 1.0e-4, kl_coef: 0.02, clip: null, lora_rank: 16, lora_layers: ">L", checkpoint_every: 1, num_runs: 1, seed: 130725}
PriceEvalConfig: {price_samples: [512], direct_samples: 512, eval_prompts: 500, batch_size: 8}
OutputConfig: {results_dir: results, name: real_lr1e-4_s2}
