[project]
name = "grpo-trait-dynamics"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    # shared (Parts 1-2, simple-theory)
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "torch>=2.12.1",
    # Part 3 (llm-activation-experiment)
    "transformers>=4.44",
    "datasets>=2.20",
    "peft>=0.12",
    "safetensors>=0.4",
    "huggingface-hub>=0.24",
    "flash-linear-attention>=0.5.1",
]

[tool.uv]
# Monorepo of runnable scripts across simple-theory/ and llm-activation-experiment/.
# This pyproject only defines the shared environment; there is no importable
# top-level package (each experiment imports its own local `src` by cwd).
package = false
