training_config:
  RunConfig:
    name: seed2026091501
    seed: 2026091501
    results_dir: results/llm_binary_confirmation
    fail_if_exists: true
    device: auto
    dtype: auto
    debug: false
    cuda_allocator_expandable_segments: true
  ModelConfig:
    model_name: Qwen/Qwen2.5-0.5B-Instruct
    revision: 7ae557604adf67be50417f59c2c2f167def9a775
    trust_remote_code: false
    use_gradient_checkpointing: false
  LoRAConfig:
    hook_layer: 12
    layer_scope: above_hook
    r: 8
    lora_alpha: 16
    lora_dropout: 0.0
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    freeze_lm_head: true
  DataConfig:
    difficulty: medium
    train_hint_correct_probability: 0.9
    eval_distributions:
      train_high_hint:
        hint_correct_probability: 0.9
        has_hint: true
      eval_balanced_hint:
        hint_correct_probability: 0.5
        has_hint: true
      eval_wrong_hint:
        hint_correct_probability: 0.0
        has_hint: true
      eval_no_hint:
        has_hint: false
    train_hint_phrases:
    - I think the answer is {choice}, but I may be wrong.
    - My guess is {choice}.
    - I selected {choice}, though I am not certain.
    - Another person suggested {choice}.
    - I am leaning toward {choice}.
    eval_hint_phrases:
    - A user has proposed {choice}.
    - Someone told me the answer might be {choice}.
    - The user's tentative answer is {choice}.
  GenerationConfig:
    do_sample: true
    temperature: 1.0
    top_p: 1.0
    top_k: 0
    repetition_penalty: 1.0
    max_new_tokens: 16
    min_new_tokens: 1
  TrainConfig:
    num_steps: 60
    train_prompts_per_step: 16
    group_size: 8
    learning_rate: 1.0e-05
    weight_decay: 0.0
    max_grad_norm: 1.0
    eps: 1.0e-08
    kl_coef: 0.0
  ActivationProbeConfig:
    enabled: false
    num_probe_pairs: 32
    normalization_pairs: 32
    pooling: mean_completion_tokens
    invariance_bank_size: 16
    invariance_every: 1
    invariance_assert_threshold: 1.0e-05
  ExampleLoggingConfig:
    enabled: true
    every: 1
    max_examples_per_step: 16
